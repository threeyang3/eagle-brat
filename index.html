<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRAT - Eagle Plugin Manager</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="header-left">
        <h1>BRAT</h1>
        <span class="subtitle">Beta Reviewers Auto-update Tool</span>
      </div>
      <div class="header-right">
        <button id="btn-check-all" class="btn btn-secondary" title="Check all plugins for updates">
          Check Updates
        </button>
        <button id="btn-settings" class="btn btn-icon" title="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <main class="main">
      <!-- Add Plugin Section -->
      <section class="add-section">
        <div class="add-form">
          <input type="text" id="input-repo" placeholder="GitHub repository (e.g. username/repo)" autocomplete="off">
          <button id="btn-fetch" class="btn btn-primary">Fetch</button>
          <button id="btn-install" class="btn btn-success" disabled>Install</button>
        </div>
        <div id="repo-preview" class="repo-preview hidden"></div>
      </section>

      <!-- Plugin List -->
      <section class="plugin-list-section">
        <h2>Installed Plugins <span id="plugin-count" class="badge">0</span></h2>
        <div id="plugin-list" class="plugin-list">
          <div class="empty-state">
            <p>No plugins installed yet.</p>
            <p class="hint">Enter a GitHub repository address above to install a plugin.</p>
          </div>
        </div>
      </section>
    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden">
      <div class="modal-overlay"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h3>Settings</h3>
          <button class="btn-close" id="btn-close-settings">&times;</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="input-token">GitHub Personal Access Token</label>
            <input type="password" id="input-token" placeholder="ghp_xxxxxxxxxxxx">
            <p class="help-text">Optional. Used for private repos and higher API rate limits.</p>
          </div>
          <div class="form-group">
            <label class="checkbox-label">
              <input type="checkbox" id="check-updates-startup">
              Check for updates on Eagle startup
            </label>
          </div>
          <div class="form-group">
            <label class="checkbox-label">
              <input type="checkbox" id="check-prereleases">
              Include pre-release versions
            </label>
          </div>
        </div>
        <div class="modal-footer">
          <button id="btn-save-settings" class="btn btn-primary">Save</button>
          <button id="btn-cancel-settings" class="btn btn-secondary">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification hidden"></div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/github.js"></script>
  <script src="js/installer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
